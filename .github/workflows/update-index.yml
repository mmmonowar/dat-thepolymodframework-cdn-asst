name: Generate Image Index

on:
  push:
    paths:
      - '10 Images/**'
      - '!10 Images/10 Index/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ExifTool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl

      - name: Run Index Generator
        run: python3 .github/scripts/generate_index.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "10 Images/10 Index/index_images.txt" "10 Images/10 Index/index_links.txt" "10 Images/10 Index/stats_images.txt"
          
          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No changes in index."
          else
            git commit -m "Auto-update image index [skip ci]"
            git pull --rebase --autostash
            git push
          fi