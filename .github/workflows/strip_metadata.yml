name: Strip Image Metadata

on:
  push:
    paths:
      - 'dat-thepolymodframework-cdn-asst/10 Images/**'
      - '!dat-thepolymodframework-cdn-asst/10 Images/10 Index/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ExifTool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect Changed Images and Strip Metadata
        run: |
          # If triggered by a normal push, diff between the before and after commit SHA
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "Comparing commit range: ${{ github.event.before }} .. ${{ github.event.after }}"
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.event.after }}" \
              | grep -E '^dat-thepolymodframework-cdn-asst/10 Images/' || true \
              | python3 .github/scripts/strip_metadata.py
          else
            echo "Performing full recursive scan..."
            python3 .github/scripts/strip_metadata.py
          fi

      - name: Verify Stripping
        run: |
          echo "Scanning directory for remaining metadata tags:"
          find "dat-thepolymodframework-cdn-asst/10 Images" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) \
            -not -path "*/10 Index/*" \
            -exec exiftool -s -G -EXIF:all -IPTC:all -XMP:all {} + || true

      - name: Commit & Push Cleaned Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all files inside the images root
          git add "dat-thepolymodframework-cdn-asst/10 Images"

          if git diff --staged --quiet; then
            echo "No file changes detected after stripping."
          else
            echo "Changes detected. Committing cleaned files..."
            git commit -m "Strip image metadata [skip ci]"
            git push
          fi